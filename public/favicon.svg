<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Radiant Sky Blue Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <!-- Deep Navy Ambient Base for High Contrast on both Light and Dark Browser Tabs -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2d48" />
      <stop offset="100%" stop-color="#031625" />
    </linearGradient>
    <filter id="skyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Sky Blue Accent Rim -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Aerodynamic Air Symbol (Flowing Sky Blue Wind Streams) -->
  <g stroke="url(#skyGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#skyGlow)">
    <!-- Top Air Stream -->
    <path d="M 10 20 H 40 A 7 7 0 1 0 40 6 A 7 7 0 0 0 33 13" />

    <!-- Center Air Stream -->
    <path d="M 7 32 H 46 A 7.5 7.5 0 1 1 46 47 A 7.5 7.5 0 0 1 38.5 39.5" />

    <!-- Bottom Air Stream -->
    <path d="M 13 44 H 26 A 6 6 0 1 0 26 32 A 6 6 0 0 0 20 38" />
  </g>
</svg>
